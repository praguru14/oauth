<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 Login - Token Based</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .login-section {
            display: block;
        }

        .section {
            display: none;
        }

        .section.show {
            display: block;
        }

        .user-info {
            background: #f0f7ff;
            border: 2px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
        }

        .user-greeting {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .user-message {
            color: #666;
            font-size: 14px;
        }

        .user-details {
            background: white;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            font-size: 13px;
            color: #555;
            margin-top: 15px;
        }

        .user-details p {
            margin: 8px 0;
        }

        .role-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin: 3px 5px 3px 0;
        }

        .role-badge.admin {
            background: #007bff;
        }

        .hello-response {
            background: #f0f7ff;
            border: 2px solid #28a745;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
        }

        .hello-message {
            font-size: 18px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error-message {
            background: #fef5f5;
            border: 2px solid #dc3545;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
            color: #dc3545;
        }

        .no-admin {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
            color: #856404;
        }

        .logout-btn {
            background: #dc3545;
            width: 100%;
            margin-top: 20px;
        }

        .logout-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 OAuth2 with Token-Based Access</h1>

    <!-- Login Section -->
    <div class="login-section" id="loginSection">
        <button onclick="loginWithKeycloak()">Login with Keycloak</button>
    </div>

    <!-- Authenticated Section -->
    <div class="section" id="authSection">
        <div class="user-info">
            <div class="user-greeting" id="greeting"></div>
            <div class="user-message">✅ Successfully authenticated!</div>
        </div>

        <div class="user-details">
            <p><strong>Username:</strong> <span id="username"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Roles:</strong></p>
            <div id="rolesContainer"></div>
        </div>

        <!-- Auto-called /hello response (Backend processed) -->
        <div class="hello-response" id="helloResponse" style="display: none;">
            <div class="hello-message" id="helloMessage"></div>
            <div class="user-message">✅ Auto-called by backend with Admin role!</div>
        </div>

        <div class="no-admin" id="noAdminMessage" style="display: none;">
            ⚠️ You don't have Admin role in realm_access. Cannot access /hello endpoint.
        </div>

        <div class="error-message" id="helloError" style="display: none;">
            <strong>❌ Error:</strong> <span id="errorText"></span>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<script>
    // On page load, check if user is authenticated
    window.addEventListener('load', () => {
        checkAuthentication();
    });

    function checkAuthentication() {
        fetch('/user')
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Not authenticated');
                }
            })
            .then(user => {
                showAuthSection(user);
            })
            .catch(error => {
                console.log('Not authenticated:', error.message);
                // Show login button (already visible)
            });
    }

    function showAuthSection(user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('authSection').classList.add('show');
        document.getElementById('greeting').textContent = `Hello, ${user.username}! 👋`;
        document.getElementById('username').textContent = user.username;
        document.getElementById('email').textContent = user.email || 'N/A';

        // Display roles
        if (user.roles && user.roles.length > 0) {
            const rolesHtml = user.roles.map(role => {
                const isAdmin = role === 'Admin';
                return `<span class="role-badge ${isAdmin ? 'admin' : ''}">${role}</span>`;
            }).join('');
            document.getElementById('rolesContainer').innerHTML = rolesHtml;
        }

        // Check if backend auto-called /hello
        if (user.isAdmin) {
            if (user.helloResponse) {
                // Backend successfully called /hello
                document.getElementById('helloMessage').textContent = user.helloResponse.message;
                document.getElementById('helloResponse').style.display = 'block';
            } else if (user.helloError) {
                // Backend failed to call /hello
                document.getElementById('errorText').textContent = user.helloError;
                document.getElementById('helloError').style.display = 'block';
            }
        } else {
            // User doesn't have Admin role
            document.getElementById('noAdminMessage').style.display = 'block';
        }
    }

    function loginWithKeycloak() {
        window.location.href = '/oauth2/authorization/keycloak';
    }

    function logout() {
        window.location.href = '/logout';
    }
</script>
</body>
</html>
